<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>John 4 Bible Study | Hightower Bible Ministry</title>
  
  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background-color: #f8fafc;
      line-height: 1.7;
    }
    header {

    .ministry-name {

    }

    }
    nav a:hover {
      color: #d6a847;
    }

      background-position: center;
      background-repeat: no-repeat;
      color: white;
      text-align: center;
      padding: 90px 20px;
    }
    .hero-kicker {
      color: #d6a847;

      letter-spacing: 3px;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .lesson-hero h1 {
      color: white;
      font-size: 44px;
      margin-bottom: 12px;
    }

      height: 3px;
      background-color: #d6a847;
      margin: 22px auto 26px;
    }
    .lesson {

      padding: 55px 22px 70px;
    }
    .intro-panel {
      background: white;
      border-left: 6px solid #d6a847;

      padding: 28px 26px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      margin-bottom: 40px;
    }
    .intro-panel h2 {
      margin-top: 0;
      color: #0b2d4f;
      font-size: 30px;
    }
    .intro-panel p {
      margin-bottom: 0;
      font-size: 18px;
      color: #4c5968;
    }
    .lesson-section {
      margin-bottom: 38px;
    }
    .lesson-section h2 {
      color: #0b2d4f;
      font-size: 30px;
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 3px solid #d6a847;
    }
    .study-box {
      padding: 22px 24px;
      margin: 18px 0;
      border-radius: 10px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }
    .study-box strong {
      display: block;
      margin-bottom: 8px;
      font-size: 18px;
    }
    .observation-box {
      background: #eef5fb;
      border-left: 6px solid #4a7ca8;
    }
    .observation-box strong {
      color: #2f5d85;
      font-size: 19px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .interpretation-box {
      background: #fff6e5;
      border-left: 6px solid #d6a847;
    }
    .interpretation-box strong {
      color: #9c6b18;
      font-size: 19px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .application-box {
      background: #edf8f0;
      border-left: 6px solid #4f8a5b;
    }
    .application-box strong {
      color: #35633f;
      font-size: 19px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

      gap: 24px;
      margin-top: 42px;
    }
    .summary-card {
      background: white;
      padding: 30px 26px;
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.08);
      border-top: 5px solid #d6a847;
    }
    .summary-card h3 {
      color: #0b2d4f;
      margin-top: 0;
      font-size: 24px;
      text-align: center;
    }

    .summary-card ol {
      padding-left: 22px;
      margin-bottom: 0;
    }
    .summary-card li {
      margin-bottom: 10px;
    }
    .summary-card p {
      color: #4c5968;
      margin-bottom: 0;
    }
    .key-truths-card {
      background: #eef5fb;
      border-top-color: #4a7ca8;
    }
    .application-card {
      background: #fff6e5;
      border-top-color: #d6a847;
    }
    .questions-card {
      background: #edf8f0;
      border-top-color: #4f8a5b;
    }
    .back-link {
      text-align: center;
      margin-top: 50px;
    }
    .back-link a {
      color: #0b2d4f;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
    }
    .back-link a:hover {
      color: #d6a847;
    }
    footer {
      background-color: #071e33;
      color: white;
      text-align: center;
      padding: 25px;
    }

      .summary-grid {
        grid-template-columns: 1fr;
      }
    }
